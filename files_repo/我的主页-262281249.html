<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柚屿的主页</title>
    <style>
        /* 引入更有质感的字体 */
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'ZCOOL KuaiLe', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(120deg, #e0f7fa, #fcf5e3);
            color: #333;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #fff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            color: #00695c;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .contact-btn {
            display: inline-block;
            background: linear-gradient(135deg, #26a69a, #00897b);
            color: white;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(38, 166, 154, 0.3);
            transition: transform 0.2s;
            margin: 5px;
        }

        .contact-btn:active {
            transform: scale(0.96);
        }

        /* 新增：友情链接板块样式 */
        .links-section {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px dashed #ccece6;
        }

        .links-title {
            font-size: 20px;
            color: #00897b;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .links-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- 替换为你提供的头像图片 -->
        <img src="https://p1.ssl.qhimg.com/t01d4a088b8a7836d65.jpg" alt="柚屿的头像" class="avatar">
        
        <h1>柚屿</h1>

        <a href="https://b23.tv/S6GiiaV" class="contact-btn">B站</a>
        
        <!-- 新增：友情链接板块 -->
        <div class="links-section">
            <div class="links-title">友情链接</div>
            <div class="links-container">
                <!-- 这里可以添加更多链接 -->
                <a href="https://www.anytoweb.com/p/12fe2425.html" class="contact-btn">已读不回专家的主页</a>
                <a href="http://zibenjia.ct.ws/index.php" class="contact-btn">资本家的工具站</a>
                <a href="http://youyu.wuaze.com/" class="contact-btn">我的资源网站</a>
            </div>
        </div>

    </div>

</body>
</html>
