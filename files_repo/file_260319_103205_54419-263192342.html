<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云墨商店</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s, background 0.2s;
}

html, body {
  height: 100%;
}

body {
  background: #222;
  color: #fff;
  display: flex;
  flex-direction: column;
}

body.light {
  background: #f9f9f9;
  color: #222;
}

/* ====================== 顶部栏 ====================== */
header {
  background: #d47a8f;
  padding: 14px 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  font-size: 18px;
  font-weight: 500;
  position: relative;
}

#themeToggle {
  position: absolute;
  top: 50%;
  right: 16px;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 24px;
  overflow: hidden;
}

#themeToggle .icon {
  position: absolute;
  transition: opacity 0.2s ease;
}
#themeToggle .light-icon { opacity: 0; }
body.light #themeToggle .dark-icon { opacity: 0; }
body.light #themeToggle .light-icon { opacity: 1; }

.btn-ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transform: scale(0);
  animation: btn-ripple 0.3s linear;
  pointer-events: none;
}
body.light .btn-ripple { background: rgba(0,0,0,0.1); }

@keyframes btn-ripple {
  to { transform: scale(2.5); opacity: 0; }
}

/* ====================== 页面容器 ====================== */
.page {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.page.active { display: block; }

/* ====================== 首页 ====================== */
#home {
  text-align: center;
}

.logo-space {
  width: 120px;
  height: 120px;
  margin: 20px auto;
  background: #444;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}
body.light .logo-space { background: #e0e0e0; }

.app-name {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 10px;
}

.desc {
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 20px;
  opacity: 0.85;
}

.version-list {
  text-align: left;
  background: #333;
  padding: 15px;
  border-radius: 12px;
  margin: 20px 0;
}
body.light .version-list { background: #fff; }

.version-list h3 {
  margin-bottom: 10px;
  color: #d47a8f;
}

.version-list p {
  margin: 6px 0;
  font-size: 14px;
}

/* 按钮组：直链下载 + 网盘下载 */
.btn-group {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.btn-group button {
  flex: 1;
  padding: 14px 0;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.btn-download {
  background: #d47a8f;
  color: #fff;
}

.btn-netdisk {
  background: transparent;
  color: #fff;
  border: 2px solid #666 !important;
}
body.light .btn-netdisk {
  color: #222;
  border-color: #ccc !important;
}

/* ====================== 更新日志 ====================== */
#log h2 {
  margin-bottom: 20px;
  color: #d47a8f;
}

.log-item {
  background: #333;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 12px;
}
body.light .log-item { background: #fff; }

.log-item .version {
  font-size: 16px;
  font-weight: bold;
  color: #d47a8f;
  margin-bottom: 6px;
}

.log-item .content {
  font-size: 14px;
  line-height: 1.5;
}

/* ====================== 关于页 ====================== */
#about {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  opacity: 0.7;
}

/* ====================== 底部导航 ====================== */
footer {
  background: #333;
  box-shadow: 0 -2px 8px rgba(0,0,0,0.3);
  padding: 8px 0;
}
body.light footer { background: #fff; }

.nav {
  display: flex;
  justify-content: space-around;
  max-width: 420px;
  margin: 0 auto;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 12px;
  cursor: pointer;
  position: relative;
  min-width: 60px;
  border-radius: 20px;
  overflow: hidden;
}
body.light .nav-item { color: #222; }

.nav-item.active { color: #d47a8f !important; }

.material-icons-outlined { font-size: 24px; }

.ripple {
  position: absolute;
  border-radius: 0.2px;
  background: rgba(255,255,255,0.3);
  transform: scale(0);
  animation: ripple 0.25s linear;
  pointer-events: none;
}
body.light .ripple { background: rgba(0,0,0,0.15); }

@keyframes ripple {
  to { transform: scale(2.5); opacity: 0; }
}
</style>
</head>

<body>

<!-- 顶部 -->
<header>
  云墨商店
  <button id="themeToggle">
    <span class="icon dark-icon material-icons-outlined">dark_mode</span>
    <span class="icon light-icon material-icons-outlined">light_mode</span>
  </button>
</header>

<!-- 首页 -->
<div class="page active" id="home">
  <div class="logo-space">这里预留图标位置</div>
  <div class="app-name">云墨商店</div>

  <div class="desc">
    这是一个多功能、多设备兼容的应用商店，简洁流畅，适配各种机型与系统。<br>
    支持多版本下载，低配置手机也能流畅使用。
  </div>

  <div class="version-list">
    <h3>支持版本</h3>
    <p>• 标准版：安卓 4.4 及以上，适配低配设备</p>
    <p>• Y 系列方屏版：专为 vivo Y 方屏机型优化</p>
    <p>• Y 系列圆屏版：专为 vivo Y 圆屏机型优化</p>
    <p>• 全平台兼容：支持 Android / iOS</p>
  </div>

  <div class="btn-group">
    <button class="btn-download" id="directDownload">直链下载</button>
    <button class="btn-netdisk" id="netdiskDownload">网盘下载</button>
  </div>
</div>

<!-- 更新日志 -->
<div class="page" id="log">
  <h2>更新历史</h2>

  <div class="log-item">
    <div class="version">V1.0.0（最新）</div>
    <div class="content">
      - 全新界面上线<br>
      - 优化流畅度与动画效果<br>
      - 修复已知问题
    </div>
  </div>

  <div class="log-item">
    <div class="version">V0.9.9</div>
    <div class="content">
      - 增加明暗主题切换<br>
      - 优化按钮涟漪动画
    </div>
  </div>
</div>

<!-- 关于 -->
<div class="page" id="about">
  关于页面（预留空白，可自行编辑）
</div>

<!-- 底部导航 -->
<footer>
  <div class="nav">
    <button class="nav-item active" data-page="home">
      <span class="material-icons-outlined">home</span>
      <span>首页</span>
    </button>
    <button class="nav-item" data-page="log">
      <span class="material-icons-outlined">history</span>
      <span>更新日志</span>
    </button>
    <button class="nav-item" data-page="about">
      <span class="material-icons-outlined">info</span>
      <span>关于</span>
    </button>
  </div>
</footer>

<script>
// 明暗主题
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', (e) => {
  document.body.classList.toggle('light');
  const r = document.createElement('span');
  r.className = 'btn-ripple';
  r.style.width = r.style.height = '36px';
  themeToggle.appendChild(r);
  setTimeout(() => r.remove(), 300);
});

// 页面切换
const navItems = document.querySelectorAll('.nav-item');
const pages = document.querySelectorAll('.page');

navItems.forEach(item => {
  item.addEventListener('click', () => {
    const pageId = item.getAttribute('data-page');
    navItems.forEach(i => i.classList.remove('active'));
    pages.forEach(p => p.classList.remove('active'));
    item.classList.add('active');
    document.getElementById(pageId).classList.add('active');
  });
});

// 通用涟漪函数
function createRipple(el, e) {
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = e.clientX - rect.left - size / 2;
  const y = e.clientY - rect.top - size / 2;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 250);
}

// 底部导航涟漪
navItems.forEach(item => {
  item.addEventListener('click', (e) => {
    createRipple(item, e);
  });
});

// 下载按钮涟漪 + 延迟0.1s跳转
const downloadBtns = [
  document.getElementById('directDownload'),
  document.getElementById('netdiskDownload')
];

downloadBtns.forEach(btn => {
  btn.addEventListener('click', (e) => {
    createRipple(btn, e);
    setTimeout(() => {
      // 这里写跳转链接
      if (btn.id === 'directDownload') {
        // location.href = '直链地址';
      } else {
        // location.href = '网盘地址';
      }
    }, 100);
  });
});
</script>

</body>
</html>
