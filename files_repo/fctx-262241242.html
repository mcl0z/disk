<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NebulaOS - Liquid Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }
        
        /* 硬件加速层 */
        .gpu-layer {
            transform: translateZ(0);
            will-change: transform, opacity, filter;
            backface-visibility: hidden;
            perspective: 1000px;
        }
        
        /* 液态玻璃效果 - 动态折射 */
        .liquid-glass {
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.15) 0%, 
                rgba(255, 255, 255, 0.05) 50%,
                rgba(255, 255, 255, 0.1) 100%);
            backdrop-filter: blur(40px) saturate(200%) brightness(1.1);
            -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .liquid-glass::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
            opacity: 0.5;
            pointer-events: none;
            animation: shimmer 8s infinite linear;
        }
        
        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 深度高斯模糊层级 */
        .blur-deep {
            backdrop-filter: blur(60px) saturate(180%);
            -webkit-backdrop-filter: blur(60px) saturate(180%);
        }
        
        .blur-medium {
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
        }
        
        .blur-light {
            backdrop-filter: blur(15px) saturate(120%);
            -webkit-backdrop-filter: blur(15px) saturate(120%);
        }
        
        /* 动态 Island - 液态变形 */
        .dynamic-island {
            transition: none; /* 由JS控制动画 */
            background: #000;
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.1),
                0 4px 20px rgba(0,0,0,0.5);
        }
        
        .island-content {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .island-expanded .island-content {
            opacity: 1;
        }
        
        /* 手势跟随层 */
        .gesture-follow {
            transition: none !important;
        }
        
        .gesture-spring {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        opacity 0.3s ease,
                        filter 0.3s ease !important;
        }
        
        /* 负一屏 */
        .minus-one-screen {
            transform: translateX(-100%);
        }
        
        /* 页面层级管理 */
        .layer-home { z-index: 10; }
        .layer-apps { z-index: 20; }
        .layer-multitask { z-index: 30; }
        .layer-control { z-index: 40; }
        .layer-island { z-index: 50; }
        .layer-status { z-index: 60; }
        
        /* 应用图标 - 液态悬浮 */
        .app-icon {
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .app-icon:active {
            transform: scale(0.88);
            transition: transform 0.05s ease;
        }
        
        .app-icon:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        /* 多任务卡片 - 3D堆叠 */
        .task-card {
            transform-style: preserve-3d;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .task-card.active {
            transform: scale(1.05) translateZ(20px);
        }
        
        /* 下拉刷新/状态栏 */
        .pull-indicator {
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        
        /* 滚动容器 */
        .scroll-container {
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        
        .scroll-container::-webkit-scrollbar {
            display: none;
        }
        
        /* 通知 */
        .notification-toast {
            animation: slideInTop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes slideInTop {
            from { transform: translateY(-100px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        /* 充电波纹 */
        @keyframes chargePulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 0.3; }
        }
        
        .charging-effect {
            animation: chargePulse 2s infinite;
        }
        
        /* 键盘 */
        .keyboard-key {
            transition: all 0.1s ease;
        }
        
        .keyboard-key:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.4);
        }
        
        /* 消息气泡 */
        .message-bubble {
            max-width: 70%;
            word-wrap: break-word;
        }
        
        /* 浏览器地址栏 */
        .address-bar:focus-within {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        
        /* 设置开关 */
        .toggle-switch {
            transition: background-color 0.3s ease;
        }
        
        .toggle-switch::after {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .toggle-active::after {
            transform: translateX(24px);
        }
        
        /* 计算器按钮 */
        .calc-btn {
            transition: all 0.15s ease;
        }
        
        .calc-btn:active {
            transform: scale(0.9);
            filter: brightness(1.2);
        }
        
        /* 音乐波形 */
        @keyframes wave {
            0%, 100% { height: 20%; }
            50% { height: 100%; }
        }
        
        .music-wave {
            animation: wave 1s ease-in-out infinite;
        }
        
        /* 天气动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .weather-icon {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-black text-white antialiased">

    <!-- 主容器 -->
    <div id="os-container" class="relative w-full h-screen max-w-md mx-auto overflow-hidden bg-black shadow-2xl">
        
        <!-- 动态壁纸层 - 视差响应 -->
        <div id="wallpaper-layer" class="absolute inset-0 gpu-layer">
            <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-purple-900 to-black"></div>
            <div class="absolute inset-0 opacity-30">
                <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-blue-500 rounded-full blur-3xl animate-pulse"></div>
                <div class="absolute bottom-1/3 right-1/4 w-80 h-80 bg-purple-500 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
                <div class="absolute top-1/2 left-1/2 w-48 h-48 bg-pink-500 rounded-full blur-3xl animate-pulse" style="animation-delay: 2s;"></div>
            </div>
            <!-- 液态光效 -->
            <div class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%" height="100%" filter="url(%23noise)" opacity="0.05"/%3E%3C/svg%3E')] opacity-20"></div>
        </div>

        <!-- 负一屏 (Today View) -->
        <div id="minus-one" class="absolute inset-0 gpu-layer minus-one-screen layer-home bg-black/80 blur-deep">
            <div class="pt-14 pb-8 px-6 h-full scroll-container">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">今天</h2>
                    <span class="text-sm text-gray-400" id="minus-date">10月24日 星期四</span>
                </div>
                
                <!-- 搜索 -->
                <div class="liquid-glass rounded-2xl p-4 mb-6 flex items-center gap-3 cursor-pointer" onclick="openApp('search')">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <span class="text-gray-400">搜索</span>
                </div>

                <!-- 小组件网格 -->
                <div class="space-y-4">
                    <!-- 天气小组件 - 大 -->
                    <div class="liquid-glass rounded-3xl p-5 relative overflow-hidden" onclick="openApp('weather')">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="text-sm text-gray-300 mb-1">北京</div>
                                <div class="text-6xl font-light">24°</div>
                                <div class="text-sm mt-2 text-gray-300">多云 · 空气质量 优</div>
                            </div>
                            <div class="weather-icon">
                                <svg class="w-16 h-16 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                            </div>
                        </div>
                        <div class="flex justify-between mt-6 text-sm">
                            <div class="text-center"><div class="text-gray-400">现在</div><div>24°</div></div>
                            <div class="text-center"><div class="text-gray-400">14时</div><div>26°</div></div>
                            <div class="text-center"><div class="text-gray-400">15时</div><div>25°</div></div>
                            <div class="text-center"><div class="text-gray-400">16时</div><div>23°</div></div>
                        </div>
                    </div>

                    <!-- 电池小组件 -->
                    <div class="liquid-glass rounded-3xl p-5 flex items-center justify-between" onclick="openApp('battery')">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-green-400 to-emerald-600 flex items-center justify-center">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            </div>
                            <div>
                                <div class="font-medium">电池电量</div>
                                <div class="text-sm text-green-400">87% · 预计可用 12 小时</div>
                            </div>
                        </div>
                        <div class="w-16 h-8 bg-gray-800 rounded-full relative overflow-hidden">
                            <div class="absolute inset-y-0 left-0 bg-green-500 rounded-full transition-all duration-1000" style="width: 87%"></div>
                        </div>
                    </div>

                    <!-- 日程小组件 -->
                    <div class="liquid-glass rounded-3xl p-5" onclick="openApp('calendar')">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-8 h-8 bg-red-500 rounded-lg flex items-center justify-center text-sm font-bold">24</div>
                            <div class="text-sm font-medium">今天的日程</div>
                        </div>
                        <div class="space-y-2">
                            <div class="flex items-center gap-3 text-sm">
                                <div class="w-1 h-8 bg-blue-500 rounded-full"></div>
                                <div class="flex-1">
                                    <div class="font-medium">团队会议</div>
                                    <div class="text-xs text-gray-400">14:00 - 15:30</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-3 text-sm">
                                <div class="w-1 h-8 bg-purple-500 rounded-full"></div>
                                <div class="flex-1">
                                    <div class="font-medium">项目评审</div>
                                    <div class="text-xs text-gray-400">16:00 - 17:00</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 快捷指令 -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="liquid-glass rounded-2xl p-4 flex items-center gap-3 cursor-pointer active:scale-95 transition-transform" onclick="toggleFlashlight()">
                            <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center" id="flashlight-icon">
                                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            </div>
                            <span class="text-sm">手电筒</span>
                        </div>
                        <div class="liquid-glass rounded-2xl p-4 flex items-center gap-3 cursor-pointer active:scale-95 transition-transform" onclick="openApp('calculator')">
                            <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center">
                                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                            </div>
                            <span class="text-sm">计算器</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主屏幕 -->
        <div id="home-screen" class="absolute inset-0 gpu-layer layer-home pt-12 pb-24 px-6">
            <!-- 状态栏 -->
            <div id="status-bar" class="absolute top-0 left-0 right-0 h-12 flex justify-between items-end px-8 pb-2 text-sm font-semibold z-50 cursor-pointer" ontouchstart="handleStatusPullStart(event)" ontouchmove="handleStatusPullMove(event)" ontouchend="handleStatusPullEnd(event)">
                <div id="status-time" class="tabular-nums">09:41</div>
                <div class="flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
                    <div class="w-6 h-3 border border-white/80 rounded-sm relative">
                        <div id="battery-fill" class="absolute inset-0.5 bg-white rounded-sm" style="width: 85%"></div>
                    </div>
                </div>
            </div>

            <!-- 动态 Island -->
            <div id="dynamic-island" class="absolute top-3 left-1/2 -translate-x-1/2 h-10 bg-black rounded-full dynamic-island layer-island flex items-center justify-center cursor-pointer overflow-hidden" style="width: 120px;" onclick="toggleIsland()">
                <div class="island-content flex items-center gap-3 px-4 w-full">
                    <div class="flex items-center gap-2 flex-1">
                        <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                        <span class="text-xs font-medium text-white/90">正在录音</span>
                    </div>
                    <div class="w-6 h-6 rounded-full bg-gradient-to-br from-purple-400 to-pink-400 overflow-hidden">
                        <div class="w-full h-full bg-gray-600"></div>
                    </div>
                </div>
                <!--  Island 展开内容 -->
                <div id="island-expanded-content" class="absolute inset-0 hidden flex-col p-4">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm font-medium">实时活动</span>
                        <button onclick="event.stopPropagation(); toggleIsland()" class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                    <div class="flex-1 flex items-center justify-center gap-4">
                        <div class="text-center">
                            <div class="text-2xl font-bold">12:34</div>
                            <div class="text-xs text-gray-400">计时器</div>
                        </div>
                        <div class="w-px h-12 bg-white/20"></div>
                        <div class="text-center">
                            <div class="text-2xl font-bold">87%</div>
                            <div class="text-xs text-gray-400">电量</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 小组件区域 -->
            <div class="grid grid-cols-2 gap-4 mb-8 mt-8">
                <div class="liquid-glass rounded-3xl p-4 h-36 cursor-pointer active:scale-95 transition-transform" onclick="openApp('weather')">
                    <div class="flex justify-between items-start h-full flex-col">
                        <div class="flex items-center gap-2">
                            <svg class="w-5 h-5 text-yellow-400 weather-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                            <span class="text-xs text-white/70">天气</span>
                        </div>
                        <div>
                            <div class="text-4xl font-light">24°</div>
                            <div class="text-xs text-white/60 mt-1">多云 · 最高28°</div>
                        </div>
                    </div>
                </div>

                <div class="liquid-glass rounded-3xl p-4 h-36 cursor-pointer active:scale-95 transition-transform" onclick="openApp('battery')">
                    <div class="flex flex-col justify-between h-full">
                        <div class="flex items-center gap-2">
                            <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            <span class="text-xs text-white/70">电池</span>
                        </div>
                        <div class="space-y-2">
                            <div class="text-3xl font-light">87%</div>
                            <div class="w-full h-2 bg-white/20 rounded-full overflow-hidden">
                                <div class="h-full bg-green-400 rounded-full charging-effect" style="width: 87%"></div>
                            </div>
                            <div class="text-xs text-green-400">正在充电</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 应用网格 -->
            <div class="grid grid-cols-4 gap-x-4 gap-y-6 px-1" id="app-grid">
                <!-- 应用由JS生成 -->
            </div>

            <!-- Dock -->
            <div class="absolute bottom-8 left-4 right-4 liquid-glass rounded-3xl p-4 flex justify-around items-center backdrop-blur-xl">
                <div class="app-icon w-14 h-14 bg-green-500 rounded-2xl flex items-center justify-center cursor-pointer shadow-lg" onclick="openApp('phone')">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                </div>
                <div class="app-icon w-14 h-14 bg-blue-500 rounded-2xl flex items-center justify-center cursor-pointer shadow-lg" onclick="openApp('browser')">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                </div>
                <div class="app-icon w-14 h-14 bg-white rounded-2xl flex items-center justify-center cursor-pointer shadow-lg" onclick="openApp('messages')">
                    <svg class="w-7 h-7 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </div>
                <div class="app-icon w-14 h-14 bg-gradient-to-br from-pink-500 to-orange-500 rounded-2xl flex items-center justify-center cursor-pointer shadow-lg" onclick="openApp('music')">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                </div>

            expression: '0',
            render() {
                return `
                    <div class="h-full bg-black flex flex-col">
                        <div class="flex-1 flex items-end justify-end p-6 pb-12">
                            <div class="text-6xl font-light tabular-nums tracking-tight" id="calc-display">${this.expression}</div>

                                {label: '%', color: 'bg-gray-400 text-black', action: 'percent'},
                                {label: '÷', color: 'bg-orange-500 text-white', action: 'op', val: '/'},
                                {label: '7', color: 'bg-gray-800 text-white', action: 'num', val: '7'},
                                {label: '8', color: 'bg-gray-800 text-white', action: 'num', val: '8'},
                                {label: '9', color: 'bg-gray-800 text-white', action: 'num', val: '9'},
                                {label: '×', color: 'bg-orange-500 text-white', action: 'op', val: '*'},
                                {label: '4', color: 'bg-gray-800 text-white', action: 'num', val: '4'},
                                {label: '5', color: 'bg-gray-800 text-white', action: 'num', val: '5'},
                                {label: '6', color: 'bg-gray-800 text-white', action: 'num', val: '6'},
                                {label: '-', color: 'bg-orange-500 text-white', action: 'op', val: '-'},
                                {label: '1', color: 'bg-gray-800 text-white', action: 'num', val: '1'},
                                {label: '2', color: 'bg-gray-800 text-white', action: 'num', val: '2'},
                                {label: '3', color: 'bg-gray-800 text-white', action: 'num', val: '3'},
                                {label: '+', color: 'bg-orange-500 text-white', action: 'op', val: '+'},
                                {label: '0', color: 'bg-gray-800 text-white col-span-2', action: 'num', val: '0'},
                                {label: '.', color: 'bg-gray-800 text-white', action: 'num', val: '.'},
                                {label: '=', color: 'bg-orange-500 text-white', action: 'calc'}
                            ].map(btn => `
                                <button class="${btn.color} ${btn.colSpan ? 'col-span-2 rounded-full' : 'aspect-square rounded-full'} text-2xl font-medium calc-btn flex items-center justify-center" 
                                        onclick="CalculatorApp.handle('${btn.action}', '${btn.val || ''}')">
                                    ${btn.label}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            },
            handle(action, val) {
                if (action === 'clear') {
                    this.expression = '0';
                } else if (action === 'num') {
                    this.expression = this.expression === '0' ? val : this.expression + val;
                } else if (action === 'op') {
                    this.expression += ` ${val} `;
                } else if (action === 'calc') {
                    try {
                        this.expression = String(eval(this.expression.replace(/×/g, '*').replace(/÷/g, '/'))) || '0';
                    } catch {
                        this.expression = 'Error';
                    }
                }
                document.getElementById('calc-display').textContent = this.expression;
            }
        };

                                <div class="flex-1 bg-gray-800 rounded-xl flex items-center gap-3 px-4 py-2">
                                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                    <input type="text" placeholder="搜索应用、联系人、短信..." class="bg-transparent flex-1 outline-none text-white" autofocus>
                                </div>
                            </div>
                        </div>
                        <div class="flex-1 overflow-y-auto scroll-container px-6 pb-24">
                            <div class="text-sm text-gray-500 mb-3">建议</div>
                            <div class="space-y-2">
                                ${['天气', '设置', '照片', '音乐'].map(app => `
                                    <div class="flex items-center gap-4 p-3 rounded-xl hover:bg-white/5 cursor-pointer" onclick="openApp('${app.toLowerCase()}')">
                                        <div class="w-10 h-10 bg-gray-700 rounded-xl flex items-center justify-center">
                                            <span class="text-lg">${app[0]}</span>
                                        </div>
                                        <div class="flex-1">${app}</div>
                                        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        // ==================== 核心手势系统 ====================
        
        // 底部手势处理
        function handleBottomGestureStart(e) {
            if (State.isControlOpen) return;
            
            State.gestureState.isActive = true;
            State.gestureState.startY = e.touches[0].clientY;
            State.gestureState.startX = e.touches[0].clientX;
            State.gestureState.startTime = Date.now();
            
            const bar = document.getElementById('gesture-bar');
            bar.style.width = '160px';
            bar.style.background = 'rgba(255,255,255,0.8)';
            
            // 准备手势跟随
            const appLayer = document.getElementById('app-layer');
            const homeScreen = document.getElementById('home-screen');
            const multitaskLayer = document.getElementById('multitask-layer');
            
            if (State.currentView === 'app') {
                appLayer.classList.add('gesture-follow');
                appLayer.classList.remove('gesture-spring');
                homeScreen.classList.add('gesture-follow');
                homeScreen.classList.remove('gesture-spring');
            } else if (State.currentView === 'home') {
                homeScreen.classList.add('gesture-follow');
                homeScreen.classList.remove('gesture-spring');
                multitaskLayer.classList.remove('hidden');
                multitaskLayer.classList.add('gesture-follow');
                multitaskLayer.classList.remove('gesture-spring');
            }
        }

        function handleBottomGestureMove(e) {
            if (!State.gestureState.isActive || State.isControlOpen) return;
            
            const touch = e.touches[0];
            const deltaY = State.gestureState.startY - touch.clientY;
            const deltaX = touch.clientX - State.gestureState.startX;
            const screenHeight = window.innerHeight;
            
            State.gestureState.currentY = touch.clientY;
            State.gestureState.currentX = touch.clientX;
            
            // 计算速度用于惯性判断
            const timeDelta = Date.now() - State.gestureState.startTime;
            State.gestureState.velocity = deltaY / timeDelta;
            
            if (State.currentView === 'app') {
                // 应用内返回手势
                const progress = Math.max(0, Math.min(deltaY / (screenHeight * 0.3), 1));
                const translateY = -progress * 100;
                const scale = 0.9 + progress * 0.1;
                const opacity = 0.5 + progress * 0.5;
                
                const appLayer = document.getElementById('app-layer');
                const homeScreen = document.getElementById('home-screen');
                
                appLayer.style.transform = `translateY(${translateY}%)`;
                homeScreen.style.transform = `scale(${scale})`;
                homeScreen.style.opacity = opacity;
                
            } else if (State.currentView === 'home') {
                // 主页进入多任务
                if (deltaY > 20) {
                    const progress = Math.max(0, Math.min(deltaY / (screenHeight * 0.4), 1));
                    const translateY = (1 - progress) * 100;
                    const scale = 1 - progress * 0.1;
                    const opacity = 1 - progress * 0.5;
                    
                    const homeScreen = document.getElementById('home-screen');
                    const multitaskLayer = document.getElementById('multitask-layer');
                    
                    homeScreen.style.transform = `scale(${scale})`;
                    homeScreen.style.opacity = opacity;
                    multitaskLayer.style.transform = `translateY(${translateY}%)`;
                }
            } else if (State.currentView === 'multitask') {
                // 多任务返回主页
                const progress = Math.max(0, Math.min(-deltaY / (screenHeight * 0.3), 1));
                const translateY = progress * 100;
                const scale = 0.9 + progress * 0.1;
                const opacity = 0.5 + progress * 0.5;
                
                const homeScreen = document.getElementById('home-screen');
                const multitaskLayer = document.getElementById('multitask-layer');
                
                homeScreen.style.transform = `scale(${scale})`;
                homeScreen.style.opacity = opacity;
                multitaskLayer.style.transform = `translateY(${translateY}%)`;
            }
        }

        function handleBottomGestureEnd(e) {
            if (!State.gestureState.isActive) return;
            State.gestureState.isActive = false;
            
            const bar = document.getElementById('gesture-bar');
            bar.style.width = '144px';
            bar.style.background = 'rgba(255,255,255,0.5)';
            
            const deltaY = State.gestureState.startY - State.gestureState.currentY;
            const velocity = State.gestureState.velocity;
            const threshold = window.innerHeight * 0.15;
            
            // 添加弹簧动画类
            const appLayer = document.getElementById('app-layer');
            const homeScreen = document.getElementById('home-screen');
            const multitaskLayer = document.getElementById('multitask-layer');
            
            appLayer.classList.remove('gesture-follow');
            appLayer.classList.add('gesture-spring');
            homeScreen.classList.remove('gesture-follow');
            homeScreen.classList.add('gesture-spring');
            multitaskLayer.classList.remove('gesture-follow');
            multitaskLayer.classList.add('gesture-spring');
            
            if (State.currentView === 'app') {
                if (deltaY > threshold || velocity > 0.5) {
                    goHome();
                } else {
                    // 回弹
                    appLayer.style.transform = 'translateY(0)';
                    homeScreen.style.transform = 'scale(0.9)';
                    homeScreen.style.opacity = '0.5';
                }
            } else if (State.currentView === 'home') {
                if (deltaY > threshold || velocity > 0.5) {
                    showMultitasking();
                } else {
                    homeScreen.style.transform = 'scale(1)';
                    homeScreen.style.opacity = '1';
                    multitaskLayer.style.transform = 'translateY(100%)';
                    setTimeout(() => multitaskLayer.classList.add('hidden'), 300);
                }
            } else if (State.currentView === 'multitask') {
                if (deltaY < -threshold || velocity < -0.5) {
                    goHome();
                } else {
                    homeScreen.style.transform = 'scale(0.9)';
                    homeScreen.style.opacity = '0';
                    multitaskLayer.style.transform = 'translateY(0)';
                }
            }
        }

        // 状态栏下拉手势
        function handleStatusPullStart(e) {
            State.gestureState.isActive = true;
            State.gestureState.startY = e.touches[0].clientY;
            State.gestureState.startTime = Date.now();
        }

        function handleStatusPullMove(e) {
            if (!State.gestureState.isActive) return;
            
            const deltaY = e.touches[0].clientY - State.gestureState.startY;
            if (deltaY < 0) return; // 只允许下拉
            
            const controlPanel = document.getElementById('control-panel');
            const backdrop = document.getElementById('control-backdrop');
            
            const progress = Math.min(deltaY / 200, 1);
            const translateY = -100 + progress * 100;
            
            controlPanel.style.transform = `translateY(${translateY}%)`;
            backdrop.style.backgroundColor = `rgba(0,0,0,${progress * 0.5})`;
            
            State.isControlOpen = progress > 0.1;
        }

        function handleStatusPullEnd(e) {
            State.gestureState.isActive = false;
            const deltaY = State.gestureState.currentY - State.gestureState.startY;
            
            const controlPanel = document.getElementById('control-panel');
            
            if (deltaY > 50) {
                openControlCenter();
            } else {
                closeControlCenter();
            }
        }

        // 滑块手势
        function handleSliderStart(e, type) {
            e.stopPropagation();
            State.gestureState.isSliderActive = true;
            State.gestureState.sliderType = type;
            updateSlider(e.touches[0].clientX, type);
        }

        function handleSliderMove(e, type) {
            if (!State.gestureState.isSliderActive) return;
            e.stopPropagation();
            updateSlider(e.touches[0].clientX, type);
        }

        function handleSliderEnd(e) {
            State.gestureState.isSliderActive = false;
        }

        function updateSlider(clientX, type) {
            const slider = type === 'brightness' ? 
                document.querySelector('#brightness-fill').parentElement : 
                document.querySelector('#volume-fill').parentElement;
            
            const rect = slider.getBoundingClientRect();
            const percent = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
            
            State.sliders[type] = Math.round(percent);
            
            const fill = type === 'brightness' ? document.getElementById('brightness-fill') : document.getElementById('volume-fill');
            const thumb = type === 'brightness' ? document.getElementById('brightness-thumb') : document.getElementById('volume-thumb');
            const value = type === 'brightness' ? document.getElementById('brightness-value') : document.getElementById('volume-value');
            
            fill.style.width = `${percent}%`;
            thumb.style.left = `${percent}%`;
            value.textContent = `${Math.round(percent)}%`;
            
            // 实时调整屏幕亮度模拟
            if (type === 'brightness') {
                document.getElementById('wallpaper-layer').style.filter = `brightness(${0.3 + percent / 100 * 0.7})`;
            }
        }

        // ==================== 系统功能 ====================

        function init() {
            renderAppGrid();
            updateTime();
            setInterval(updateTime, 1000);
            
            // 初始化日期
            const date = new Date();
            const options = { month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('minus-date').textContent = date.toLocaleDateString('zh-CN', options);
            
            // 负一屏手势
            const homeScreen = document.getElementById('home-screen');
            let startX = 0;
            
            homeScreen.addEventListener('touchstart', (e) => {
                if (e.touches[0].clientX < 50) startX = e.touches[0].clientX;
            }, {passive: true});
            
            homeScreen.addEventListener('touchmove', (e) => {
                if (startX && e.touches[0].clientX - startX > 50) {
                    showMinusOne();
                }
            }, {passive: true});
            
            homeScreen.addEventListener('touchend', () => {
                startX = 0;
            }, {passive: true});
        }

        function renderAppGrid() {
            const apps = [
                ['phone', 'messages', 'browser', 'mail'],
                ['photos', 'camera', 'music', 'settings'],
                ['weather', 'calendar', 'calculator', 'notes'],
                ['maps', 'clock', 'search', 'browser']
            ];
            
            const grid = document.getElementById('app-grid');
            grid.innerHTML = apps.flat().map((appId, index) => {
                const app = AppDatabase[appId];
                if (!app) return '';
                return `
                    <div class="flex flex-col items-center gap-1 cursor-pointer" onclick="openApp('${appId}')" style="animation: fadeIn 0.5s ease ${index * 0.05}s both;">
                        <div class="app-icon w-[60px] h-[60px] bg-gradient-to-br ${app.color} rounded-2xl flex items-center justify-center shadow-lg relative overflow-hidden">
                            <svg class="w-8 h-8 ${app.iconColor || 'text-white'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="${app.icon}"></path>
                            </svg>
                            ${appId === 'messages' ? '<div class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center text-xs font-bold">3</div>' : ''}
                        </div>
                        <span class="text-[11px] font-medium mt-1 text-white/90">${app.name}</span>
                    </div>
                `;
            }).join('');
        }

        function openApp(appId) {
            if (State.isControlOpen) {
                closeControlCenter();
                return;
            }
            
            const app = AppDatabase[appId];
            if (!app) return;
            
            State.activeApp = appId;
            State.currentView = 'app';
            
            // 添加到运行中的应用
            if (!State.runningApps.find(a => a.id === appId)) {
                State.runningApps.push({ id: appId, name: app.name, color: app.color });
            }
            
            const appLayer = document.getElementById('app-layer');
            const homeScreen = document.getElementById('home-screen');
            
            appLayer.innerHTML = `<div class="h-full w-full animate-fadeIn">${app.render()}</div>`;
            
            appLayer.classList.remove('hidden');
            appLayer.style.transform = 'translateY(0)';
            homeScreen.style.transform = 'scale(0.9)';
            homeScreen.style.opacity = '0.5';
            
            // 触发 Island 动画
            if (appId === 'music' && MusicApp.isPlaying) {
                expandIsland();
            }
        }

        function goHome() {
            State.currentView = 'home';
            State.activeApp = null;
            
            const appLayer = document.getElementById('app-layer');
            const homeScreen = document.getElementById('home-screen');
            const multitaskLayer = document.getElementById('multitask-layer');
            const minusOne = document.getElementById('minus-one');
            
            appLayer.style.transform = 'translateY(100%)';
            homeScreen.style.transform = 'scale(1)';
            homeScreen.style.opacity = '1';
            multitaskLayer.style.transform = 'translateY(100%)';
            minusOne.style.transform = 'translateX(-100%)';
            
            setTimeout(() => {
                multitaskLayer.classList.add('hidden');
            }, 300);
            
            // 收起 Island
            if (State.isIslandExpanded) {
                toggleIsland();
            }
        }

        function showMultitasking() {
            State.currentView = 'multitask';
            
            const multitaskLayer = document.getElementById('multitask-layer');
            const homeScreen = document.getElementById('home-screen');
            const taskList = document.getElementById('task-list');
            
            // 生成任务卡片
            const apps = State.runningApps.length > 0 ? State.runningApps : [
                {id: 'browser', name: '浏览器', color: 'from-blue-400 to-blue-600'},
                {id: 'music', name: '音乐', color: 'from-pink-500 to-red-600'}
            ];
            
            taskList.innerHTML = apps.map((app, index) => `
                <div class="task-card bg-gray-800 rounded-3xl overflow-hidden relative h-72 shadow-2xl cursor-pointer" 
                     style="z-index: ${apps.length - index}"
                     onclick="openApp('${app.id}')">
                    <div class="absolute top-0 left-0 right-0 h-8 bg-gray-700/50 backdrop-blur flex items-center justify-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
                    </div>
                    <div class="h-full pt-8 bg-gradient-to-br ${app.color} flex items-center justify-center opacity-80">
                        <span class="text-3xl font-bold text-white/50">${app.name}</span>
                    </div>
                    <button class="absolute top-2 right-2 w-8 h-8 bg-black/30 rounded-full flex items-center justify-center text-white hover:bg-black/50 transition-colors" onclick="event.stopPropagation(); closeTask('${app.id}')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            `).join('');
            
            multitaskLayer.classList.remove('hidden');
            requestAnimationFrame(() => {
                multitaskLayer.style.transform = 'translateY(0)';
                homeScreen.style.transform = 'scale(0.9)';
                homeScreen.style.opacity = '0';
            });
        }

        function closeTask(appId) {
            State.runningApps = State.runningApps.filter(a => a.id !== appId);
            showMultitasking();
        }

        function closeAllTasks() {
            State.runningApps = [];
            goHome();
            showNotification('多任务', '已关闭所有应用');
        }

        function openControlCenter() {
            State.isControlOpen = true;
            const panel = document.getElementById('control-panel');
            const backdrop = document.getElementById('control-backdrop');
            
            panel.style.transform = 'translateY(0)';
            backdrop.style.backgroundColor = 'rgba(0,0,0,0.5)';
        }

        function closeControlCenter() {
            State.isControlOpen = false;
            const panel = document.getElementById('control-panel');
            const backdrop = document.getElementById('control-backdrop');
            
            panel.style.transform = 'translateY(-100%)';
            backdrop.style.backgroundColor = 'rgba(0,0,0,0)';
        }

        function toggleControlSwitch(el, type) {
            const bg = el.querySelector('.switch-bg');
            const isActive = bg.classList.contains('bg-blue-500') || bg.classList.contains('bg-green-500');
            
            if (isActive) {
                bg.className = 'w-10 h-10 rounded-full bg-gray-600 flex items-center justify-center switch-bg transition-colors duration-300';
            } else {
                const color = type === 'cellular' ? 'bg-green-500' : 'bg-blue-500';
                bg.className = `w-10 h-10 rounded-full ${color} flex items-center justify-center switch-bg transition-colors duration-300`;
            }
            
            State.switches[type] = !isActive;
            
            // 触觉反馈
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function showMinusOne() {
            const minusOne = document.getElementById('minus-one');
            minusOne.style.transform = 'translateX(0)';
            State.currentView = 'minus-one';
        }

        // Island 控制
        function toggleIsland() {
            const island = document.getElementById('dynamic-island');
            const content = island.querySelector('.island-content');
            const expandedContent = document.getElementById('island-expanded-content');
            
            State.isIslandExpanded = !State.isIslandExpanded;
            
            if (State.isIslandExpanded) {
                island.style.width = '90%';
                island.style.height = '120px';
                island.style.borderRadius = '24px';
                content.style.display = 'none';
                expandedContent.style.display = 'flex';
                island.classList.add('island-expanded');
            } else {
                island.style.width = '120px';
                island.style.height = '40px';
                island.style.borderRadius = '20px';
                content.style.display = 'flex';
                expandedContent.style.display = 'none';
                island.classList.remove('island-expanded');
            }
        }

        function expandIsland() {
            if (!State.isIslandExpanded) toggleIsland();
        }

        // 手电筒
        function toggleFlashlight() {
            State.switches.flashlight = !State.switches.flashlight;
            const icon = document.getElementById('flashlight-icon');
            if (State.switches.flashlight) {
                icon.classList.remove('bg-blue-500');
                icon.classList.add('bg-white', 'text-blue-500');
                showNotification('控制中心', '手电筒已开启');
            } else {
                icon.classList.add('bg-blue-500');
                icon.classList.remove('bg-white', 'text-blue-500');
            }
        }

        // 通知系统
        function showNotification(title, body) {
            const center = document.getElementById('notification-center');
            const id = Date.now();
            
            const notif = document.createElement('div');
            notif.className = 'notification-toast liquid-glass mx-4 mt-2 p-4 rounded-2xl pointer-events-auto cursor-pointer transform transition-all duration-300 hover:scale-102';
            notif.innerHTML = `
                <div class="flex items-start gap-3">
                    <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center flex-shrink-0">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-semibold text-sm mb-1">${title}</div>
                        <div class="text-sm text-white/80 line-clamp-2">${body}</div>
                        <div class="text-xs text-white/50 mt-2">刚刚</div>
                    </div>
                </div>
            `;
            
            notif.onclick = () => {
                notif.style.transform = 'translateX(120%)';
                setTimeout(() => notif.remove(), 300);
            };
            
            center.appendChild(notif);
            
            setTimeout(() => {
                if (notif.parentNode) {
                    notif.style.opacity = '0';
                    notif.style.transform = 'translateX(120%)';
                    setTimeout(() => notif.remove(), 300);
                }
            }, 4000);
        }

        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('status-time').textContent = `${hours}:${minutes}`;
        }

        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (State.isControlOpen) closeControlCenter();
                else if (State.currentView !== 'home') goHome();
            }
            if (e.key === ' ' && State.currentView === 'home') {
                e.preventDefault();
                openControlCenter();
            }
        });

        // 初始化
        init();
    </script>
</body>
</html>
